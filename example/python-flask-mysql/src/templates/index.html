<head>
<title>Document</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz" crossorigin="anonymous"></script>
<body>
    <h1 class = "text-center mt-5 mb-3 text-primary">  EJEMPLO DE APP FLASK</h1>
    <div class ="container" >
        <div class = "card shadow">
            <div class = "card-body">
                <form action="/insertPais" method="POST">
                    <div class = "row mb-3">
                        <div class = "col">
                            <label>Pais Id:</label>  
                            <input type="text" class ="form-control mb-3" name="Id">
                        </div>
                        <div class = "col">
                            <label>Pais Nombre:</label>
                            <input type="text" class ="form-control mb-3" name="PaisNombre">
                        </div>
                        <div class = "col">
                            <label>Pais Sigla:</label>
                            <input type="text" class ="form-control mb-3" name="PaisSigla">
                        </div>
                        <div class = "col">
                            <button class = "btn btn-primary mb-3 mt-4" tyupe="submit">Guardar</button>
                        </div>
                    </div>
                </form>
  <!-- Tabla -->
           <table class="table table-bordered">
                <thead>
                            <th scope="col">#</th>
                            <th scope="col">Pais Nombre</th>
                            <th scope="col">País Sigla</th>

                            <th scope="col">Editar</th>
                            <th scope="col">Eliminar</th>
                        </thead>
       
                    <tbody>
                     <!--declara un bucle-->
                     {% for d in data %}
                      <tr>
                        <td>{{d.idPais}}</td>
                        <td>{{d.PaisNombre}}</td>
                        <td>{{d.PaisSigla}}</td>
                    <td><button= class="btn btn-primary btn-sm" id="">Editar</button></td>
                       <td> 
                        <a href="{{ url_for('eliminaPais', id=d.idPais) }}" class="btn btn-danger btn-sm">Eliminar</a>
                    </td> 
                      </tr>
                     {% endfor %}
</tbody>
 
   </table>
               
            </div>
        </div>
    </div>
</body>
