<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trámite Claro</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='estilos.css') }}">
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand fw-semibold" href="{{ url_for('home') }}">
        <i class="bi bi-journal-check me-1"></i>
        Trámite Claro
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal" aria-controls="menuPrincipal" aria-expanded="false" aria-label="Abrir menú">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menuPrincipal">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link" href="{{ url_for('categorias') }}">Trámites</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{{ url_for('crear_categoria') }}">Crear categoría</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{{ url_for('guia_tramite') }}">Guía de trámite</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        <div class="card shadow-sm">
          <div class="card-header bg-success text-white text-center py-3">
            <p class="mb-1 small text-uppercase">Bienvenido</p>
            <h1 class="h3 mb-0">Trámite Claro</h1>
          </div>
          <div class="card-body text-center p-4">
            <img
              src="{{ url_for('static', filename='Logo de Trámite Claro.png') }}"
              alt="Logo de Trámite Claro"
              class="img-fluid logo mb-3"
            >
            <p class="lead text-secondary">Tu guía sencilla para hacer trámites sin enredos.</p>
            <div class="d-flex flex-wrap justify-content-center gap-2 mb-4">
              <span class="badge text-bg-primary">Visa</span>
              <span class="badge text-bg-success">Pasaporte</span>
              <span class="badge text-bg-warning">Apostilla</span>
              <span class="badge text-bg-info">Cambio de propietario</span>
              <span class="badge text-bg-danger">Residencia</span>
            </div>
            <a class="btn btn-primary btn-lg" href="{{ url_for('categorias') }}">
              Comenzar
              <i class="bi bi-arrow-right-circle ms-1"></i>
            </a>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
