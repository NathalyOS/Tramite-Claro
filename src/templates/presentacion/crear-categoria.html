<!---1.3 CREAR CATEGORIAS-->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear Categoría - Trámite Claro</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='estilos.css') }}">
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand fw-semibold" href="{{ url_for('home') }}">
        <i class="bi bi-journal-check me-1"></i>
        Trámite Claro
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal" aria-controls="menuPrincipal" aria-expanded="false" aria-label="Abrir menú">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menuPrincipal">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link" href="{{ url_for('categorias') }}">Trámites</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" href="{{ url_for('crear_categoria') }}">Crear categoría</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{{ url_for('actualizar_tramite') }}">Actualizar trámite</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{{ url_for('guia_tramite') }}">Guía de trámite</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-7">
        <div class="card shadow-sm border-success">
          <div class="card-header bg-success text-white">
            <h1 class="h4 mb-0">Administración de categorías</h1>
          </div>
          <div class="card-body p-4">
            <div class="text-center mb-4">
              <img
                src="{{ url_for('static', filename='Logo de Trámite Claro.png') }}"
                alt="Trámite Claro Logo"
                class="img-fluid logo"
              >
            </div>
            <h2 class="h5 text-success mb-3">Crear nueva categoría</h2>
            <div id="aviso-categoria" class="alert mb-3" hidden></div>
            <form id="form-crear-categoria">
              <div class="mb-3">
                <label class="form-label" for="nombre-categoria">Nombre de la categoría</label>
                <input class="form-control" type="text" id="nombre-categoria" required placeholder="Ej. Impuestos y Finanzas">
              </div>

              <div class="mb-3">
                <label class="form-label" for="descripcion-categoria">Descripción corta</label>
                <textarea class="form-control" id="descripcion-categoria" rows="3" required placeholder="Breve descripción de los trámites incluidos..."></textarea>
              </div>

              <div class="mb-4">
                <label class="form-label" for="estado-categoria">Estado inicial</label>
                <select class="form-select" id="estado-categoria">
                  <option value="publicado">Publicada</option>
                  <option value="desactivado">Desactivada</option>
                </select>
              </div>

              <div class="d-flex flex-wrap gap-2">
                <button type="submit" class="btn btn-success">Guardar categoría</button>
                <a class="btn btn-outline-danger" href="{{ url_for('home') }}">Cancelar</a>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const formulario = document.querySelector("#form-crear-categoria");
    const aviso = document.querySelector("#aviso-categoria");

    formulario.addEventListener("submit", (evento) => {
      evento.preventDefault();
      const estado = document.querySelector("#estado-categoria").value;
      fetch(window.location.pathname, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          nombre: document.querySelector("#nombre-categoria").value.trim(),
          descripcion: document.querySelector("#descripcion-categoria").value.trim(),
          estado: estado,
        }),
      }).then(async (respuesta) => {
        const datos = await respuesta.json();
        aviso.hidden = false;
        if (!respuesta.ok) {
          aviso.className = "alert alert-danger mb-3";
          aviso.textContent = datos.error || "No se pudo guardar la categoría.";
          return;
        }
        aviso.className = "alert alert-success mb-3";
        aviso.textContent = estado === "publicado"
          ? "Categoría guardada. Ya puedes buscarla en Trámites."
          : "Categoría guardada. Como está desactivada, no aparece en la búsqueda.";
        formulario.reset();
      });
    });
  </script>
</body>
</html>
